<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stems Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0d1117; color: #c9d1d9; }</style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-white mb-6">Stems & Collab Marketplace</h1>
        
        <form id="stemForm" class="bg-gray-900 p-6 rounded-xl border border-gray-800 mb-8">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <input type="text" id="artistName" placeholder="Artist Name" required class="bg-gray-800 p-2 rounded border border-gray-700 w-full text-white">
                <input type="text" id="trackTitle" placeholder="Track Title" required class="bg-gray-800 p-2 rounded border border-gray-700 w-full text-white">
            </div>
            <div class="mb-4">
                <input type="file" id="stemFile" accept=".mp3,.wav,.zip" class="w-full text-gray-400">
            </div>
            <button type="submit" id="submitBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded w-full">Upload Stem Pack</button>
        </form>

        <div id="marketplaceList" class="space-y-4"></div>
    </div>

    <script>
        // PLAATS HIER JE GOOGLE SCRIPT URL:
        const API_URL = "https://script.google.com/macros/s/AKfycbyXbBcipH3z0nnfgL8KaxUacZL0uxuQbjtEG06SUbLZXhq6InSk09NsU4mwALFxmjdh/exec";

        document.getElementById('stemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Uploading...";
            
            const file = document.getElementById('stemFile').files[0];
            const reader = new FileReader();
            
            reader.onload = async (event) => {
                const payload = {
                    artistName: document.getElementById('artistName').value,
                    trackTitle: document.getElementById('trackTitle').value,
                    bpmKey: "N/A",
                    stemType: "Pack",
                    lookingFor: "Collaboration",
                    fileData: event.target.result,
                    fileName: file.name
                };

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    if(result.status === "success") {
                        alert("Succes! Data verzonden.");
                        location.reload();
                    }
                } catch (err) {
                    alert("Fout: " + err);
                }
            };
            reader.readAsDataURL(file);
        });

        async function loadStems() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const list = document.getElementById('marketplaceList');
                list.innerHTML = data.map(item => `
                    <div class="bg-gray-800 p-4 rounded border border-gray-700 flex justify-between">
                        <div><h3 class="font-bold">${item.trackTitle}</h3><p class="text-sm text-cyan-400">${item.artistName}</p></div>
                        <a href="${item.downloadUrl}" target="_blank" class="text-cyan-400">Download</a>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }
        loadStems();
    </script>
</body>
</html>
