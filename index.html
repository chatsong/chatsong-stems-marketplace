
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stems Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0d1117; color: #c9d1d9; }</style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-white mb-6">Stems & Collab Marketplace</h1>
        
        <form id="stemForm" 
              action="https://script.google.com/macros/s/AKfycbzBqUongeZRM_0iZ74RwpC6Itg7VbO0-kZCfse2H2U/exec" 
              method="POST" 
              target="uploadTarget"
              enctype="multipart/form-data"
              class="bg-gray-900 p-6 rounded-xl border border-gray-800 mb-8">
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <input type="text" name="artistName" placeholder="Artist Name" required 
                    class="bg-gray-800 p-2 rounded border border-gray-700 w-full text-white">
                <input type="text" name="trackTitle" placeholder="Track Title" required 
                    class="bg-gray-800 p-2 rounded border border-gray-700 w-full text-white">
            </div>
            <div class="mb-4">
                <input type="file" name="file" accept=".mp3,.wav,.zip" required 
                    class="w-full text-gray-400">
            </div>
            <button type="submit" id="submitBtn" 
                class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded w-full disabled:opacity-50">
                Upload Stem Pack
            </button>
        </form>

        <iframe name="uploadTarget" id="uploadTarget" style="display:none;"></iframe>

        <div id="marketplaceList" class="space-y-4"></div>
    </div>

    <script>
        const BASE_URL = "https://script.google.com/macros/s/AKfycbzBqUongeZRM_0iZ74RwpC6Itg7VbO0-kZCfse2H2U/dev";
        
        function loadStems() {
            const list = document.getElementById('marketplaceList');
            list.innerHTML = "<p class='text-gray-500 italic'>Laden...</p>";
            
            const script = document.createElement('script');
            const callbackName = 'cb' + Date.now();
            
            window[callbackName] = function(data) {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                
                if (!data || data.length === 0) {
                    list.innerHTML = "<p class='text-gray-500 italic'>Nog geen stems beschikbaar.</p>";
                    return;
                }
                if (data.status === "error") {
                    list.innerHTML = "<p class='text-red-400'>Fout: " + data.message + "</p>";
                    return;
                }

                list.innerHTML = data.map(item => {
                    const title = item["Track Title"] || item.trackTitle || "Naamloos";
                    const artist = item["Artist Name"] || item.artistName || "Onbekend";
                    const url = item["De échte Google Drive Download URL"] || item.downloadUrl || "#";

                    return `
                        <div class="bg-gray-800 p-4 rounded border border-gray-700 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-white">${title}</h3>
                                <p class="text-sm text-cyan-400">${artist}</p>
                            </div>
                            <a href="${url}" target="_blank" 
                                class="bg-cyan-700 hover:bg-cyan-600 text-white text-xs px-3 py-2 rounded">
                                Download
                            </a>
                        </div>
                    `;
                }).join('');
            };
            
            script.onerror = function() {
                list.innerHTML = "<p class='text-red-400'>Kon de lijst niet laden.</p>";
            };
            
            script.src = BASE_URL + "?callback=" + callbackName + "&v=" + Date.now();
            document.head.appendChild(script);
        }
        
        document.getElementById('uploadTarget').addEventListener('load', function() {
            setTimeout(() => {
                alert("Upload verwerkt! De lijst wordt vernieuwd.");
                document.getElementById('stemForm').reset();
                loadStems();
            }, 1500);
            
            document.getElementById('submitBtn').innerText = "Upload Stem Pack";
            document.getElementById('submitBtn').disabled = false;
        });
        
        document.getElementById('stemForm').addEventListener('submit', function() {
            document.getElementById('submitBtn').innerText = "Uploaden... Even geduld...";
            document.getElementById('submitBtn').disabled = true;
        });
        
        loadStems();
    </script>
</body>
</html>
