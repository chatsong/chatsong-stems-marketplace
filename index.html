
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stems Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0d1117; color: #c9d1d9; }</style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-white mb-6">Stems & Collab Marketplace</h1>
        
        <form id="stemForm" class="bg-gray-900 p-6 rounded-xl border border-gray-800 mb-8">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <input type="text" id="artistName" placeholder="Artist Name" required 
                    class="bg-gray-800 p-2 rounded border border-gray-700 w-full text-white">
                <input type="text" id="trackTitle" placeholder="Track Title" required 
                    class="bg-gray-800 p-2 rounded border border-gray-700 w-full text-white">
            </div>
            <div class="mb-4">
                <input type="file" id="stemFile" accept=".mp3,.wav,.zip" required 
                    class="w-full text-gray-400">
            </div>
            <button type="submit" id="submitBtn" 
                class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded w-full disabled:opacity-50">
                Upload Stem Pack
            </button>
        </form>

        <div id="marketplaceList" class="space-y-4"></div>
    </div>

    <script>
        // VERVANG DIT MET JE NIEUWE WEB APP URL NA DEPLOY!
        const BASE_URL = "https://script.google.com/macros/s/AKfycbwTTNPnkxcagETN6rOk1SQTjMsF5smFB9djHl9K1TKPfOsCJLQWSJcO2Q8ia0--unzT/exec";
        
        // Cache-buster voor GET requests
        const API_URL_GET = BASE_URL + "?v=" + new Date().getTime();

        document.getElementById('stemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Bestand verwerken en uploaden... Even geduld...";
            btn.disabled = true;

            const fileInput = document.getElementById('stemFile');
            if (!fileInput.files.length) {
                alert("Selecteer eerst een bestand.");
                btn.disabled = false;
                btn.innerText = "Upload Stem Pack";
                return;
            }

            const file = fileInput.files[0];
            
            // Waarschuwing bij grote bestanden (>25MB = Apps Script limiet)
            if (file.size > 25 * 1024 * 1024) {
                alert("Bestand is te groot! Maximaal 25MB voor Google Apps Script.");
                btn.disabled = false;
                btn.innerText = "Upload Stem Pack";
                return;
            }

            const reader = new FileReader();
            
            reader.onload = async (event) => {
                const payload = {
                    artistName: document.getElementById('artistName').value,
                    trackTitle: document.getElementById('trackTitle').value,
                    fileData: event.target.result,
                    fileName: file.name
                };

                try {
                    const response = await fetch(BASE_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === "success") {
                        alert("Succes! Je stem pack is geüpload.");
                        document.getElementById('stemForm').reset();
                        loadStems(); // Herlaad de lijst zonder pagina-refresh
                    } else {
                        alert("Foutmelding van de server: " + result.message);
                    }
                } catch (err) {
                    alert("Verbindingsfout: " + err.message);
                    console.error(err);
                } finally {
                    btn.innerText = "Upload Stem Pack";
                    btn.disabled = false;
                }
            };
            
            reader.onerror = () => {
                alert("Fout bij het lezen van het bestand.");
                btn.disabled = false;
                btn.innerText = "Upload Stem Pack";
            };
            
            reader.readAsDataURL(file);
        });

        async function loadStems() {
            const list = document.getElementById('marketplaceList');
            list.innerHTML = "<p class='text-gray-500 italic'>Laden...</p>";
            
            try {
                const res = await fetch(API_URL_GET);
                const data = await res.json();
                
                if (!data || data.length === 0 || data.status === "error") {
                    list.innerHTML = "<p class='text-gray-500 italic'>Nog geen stems beschikbaar.</p>";
                    return;
                }

                list.innerHTML = data.map(item => {
                    const title = item["Track Title"] || item.trackTitle || "Naamloos";
                    const artist = item["Artist Name"] || item.artistName || "Onbekend";
                    const url = item["De échte Google Drive Download URL"] || item.downloadUrl || "#";

                    return `
                        <div class="bg-gray-800 p-4 rounded border border-gray-700 flex justify-between items-center">
                            <div>
                                <h3 class="font-bold text-white">${title}</h3>
                                <p class="text-sm text-cyan-400">${artist}</p>
                            </div>
                            <a href="${url}" target="_blank" 
                                class="bg-cyan-700 hover:bg-cyan-600 text-white text-xs px-3 py-2 rounded">
                                Download
                            </a>
                        </div>
                    `;
                }).join('');
            } catch(e) { 
                list.innerHTML = "<p class='text-red-400'>Kon de lijst niet laden.</p>";
                console.error("Lijst inladen mislukt:", e); 
            }
        }
        
        loadStems();
    </script>
</body>
</html>
