<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatsong Stems & Collab Marketplace</title>
    <!-- Tailwind CSS voor een strakke look -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
    </style>
</head>
<body class="p-6 font-sans">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-2">
                Stems & Collab Marketplace
            </h1>
            <p class="text-gray-400 text-lg">Deel je audiobestanden, vind producers en start vette samenwerkingen buiten het algoritme om.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Formulier Kolom -->
            <div class="bg-gray-900/50 border border-gray-800 p-6 rounded-2xl shadow-xl backdrop-blur-md h-fit">
                <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
                    <span>🚀</span> Stem Pakket Drop
                </h2>
                <form id="stemForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Artiestennaam</label>
                        <input type="text" id="artistName" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Track Titel</label>
                        <input type="text" id="trackTitle" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">BPM / Key</label>
                            <input type="text" id="bpmKey" placeholder="bijv. 128 BPM / Amin" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Type Stems</label>
                            <select id="stemType" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                                <option value="Full Pack">Full Pack</option>
                                <option value="Vocals Only">Vocals Only</option>
                                <option value="Melody / Synths">Melody / Synths</option>
                                <option value="Drums / Beats">Drums / Beats</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Download URL (Dropbox, Drive, etc.)</label>
                        <input type="url" id="downloadUrl" placeholder="https://" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Ik zoek een...</label>
                        <input type="text" id="lookingFor" placeholder="bijv. Remix, Producer, Rapper..." required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500 transition-colors">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg hover:shadow-cyan-500/20 transition-all cursor-pointer">
                        Drop op de Marketplace
                    </button>
                </form>
            </div>

            <!-- Marketplace Lijst Kolom -->
            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <span>🎧</span> Beschikbare Stems
                    </h2>
                    <button onclick="loadStems()" class="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition-colors cursor-pointer">
                        🔄 Verversen
                    </button>
                </div>
                
                <!-- Laad-indicator -->
                <div id="loading" class="text-center py-12 text-gray-500">
                    Stems worden ingeladen uit de database...
                </div>

                <!-- Hier komen de kaarten -->
                <div id="marketplaceList" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw9rHwiwhAD0CVOyJlrm2-ynOifkemCBPra8FN4VLoKIevNRypkLp2vfvxJ_tIEsxIk/exec";

        // 1. DATA OPHALEN (GET)
        async function loadStems() {
            const loadingDiv = document.getElementById('loading');
            const listDiv = document.getElementById('marketplaceList');
            
            loadingDiv.classList.remove('hidden');
            listDiv.classList.add('hidden');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                listDiv.innerHTML = '';
                
                if (data.length === 0) {
                    listDiv.innerHTML = '<p class="text-gray-500 col-span-2 text-center py-8">Nog geen stems gedropt. Wees de eerste!</p>';
                } else {
                    // Keer de volgorde om zodat de nieuwste bovenaan staan
                    data.reverse().forEach(item => {
                        const card = document.createElement('div');
                        card.className = "bg-gray-950/80 border border-gray-800 p-5 rounded-xl hover:border-gray-700 transition-all shadow-md flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-purple-950 text-purple-300 border border-purple-800">${item.stemType}</span>
                                    <span class="text-xs text-gray-500">${item.bpmKey}</span>
                                </div>
                                <h3 class="text-lg font-bold text-white mb-0.5">${item.trackTitle}</h3>
                                <p class="text-sm text-cyan-400 mb-4">By ${item.artistName}</p>
                                <div class="bg-gray-900 border border-gray-800/60 p-2.5 rounded-lg text-xs mb-4">
                                    <strong class="text-gray-400 block mb-0.5">Gezocht:</strong>
                                    <span class="text-gray-200">${item.lookingFor}</span>
                                </div>
                            </div>
                            <a href="${item.downloadUrl}" target="_blank" class="w-full text-center bg-gray-800 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg text-sm border border-gray-700 transition-colors block">
                                📥 Download Stems
                            </a>
                        `;
                        listDiv.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Fout bij ophalen:", error);
                listDiv.innerHTML = '<p class="text-red-400 col-span-2 text-center py-8">Kon de stems niet ophalen. Probeer het later opnieuw.</p>';
            } finally {
                loadingDiv.add('hidden');
                loadingDiv.classList.add('hidden');
                listDiv.classList.remove('hidden');
            }
        }

        // 2. DATA OPSLAAN (POST)
        document.getElementById('stemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Bezig met droppen...";

            const payload = {
                artistName: document.getElementById('artistName').value,
                trackTitle: document.getElementById('trackTitle').value,
                bpmKey: document.getElementById('bpmKey').value,
                stemType: document.getElementById('stemType').value,
                downloadUrl: document.getElementById('downloadUrl').value,
                lookingFor: document.getElementById('lookingFor').value
            };

            try {
                // Apps Script vereist 'no-cors' óf een schone afhandeling, we sturen dit als platte tekst/JSON string via POST
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Noodzakelijk voor Google Apps Script web-apps om CORS te omzeilen bij POST
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Formulier resetten en herladen
                document.getElementById('stemForm').reset();
                alert("Je stem pakket is succesvol toegevoegd aan de marketplace!");
                loadStems();
            } catch (error) {
                console.error("Fout bij verzenden:", error);
                alert("Er ging iets mis bij het verzenden. Controleer je connectie.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Drop op de Marketplace";
            }
        });

        // Eerste keer inladen bij openen pagina
        window.onload = loadStems;
    </script>
</body>
</html>
