
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatsong Stems & Collab Marketplace</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>body { background-color: #0d1117; color: #c9d1d9; }</style>
</head>
<body class="p-6 font-sans">
    <div class="max-w-6xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-2">Stems & Collab Marketplace</h1>
            <p class="text-gray-400 text-lg">Share your audio files, find producers, and spark fresh collaborations.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-gray-900/50 border border-gray-800 p-6 rounded-2xl shadow-xl backdrop-blur-md h-fit">
                <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><span>🚀</span> Drop Your Stem Pack</h2>
                <form id="stemForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Artist Name</label>
                        <input type="text" id="artistName" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Track Title</label>
                        <input type="text" id="trackTitle" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">BPM / Key</label>
                            <input type="text" id="bpmKey" placeholder="e.g., 128 BPM" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Stem Type</label>
                            <select id="stemType" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                                <option value="Full Pack">Full Pack</option>
                                <option value="Vocals Only">Vocals Only</option>
                                <option value="Melody / Synths">Melody / Synths</option>
                                <option value="Drums / Beats">Drums / Beats</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Hoe wil je je stems delen?</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="btnMethodUpload" class="bg-cyan-600 text-white text-xs font-bold py-2 px-2 rounded-lg border border-cyan-400 cursor-pointer">📁 Direct Upload</button>
                            <button type="button" id="btnMethodLink" class="bg-gray-800 text-gray-400 text-xs font-bold py-2 px-2 rounded-lg border border-gray-700 cursor-pointer">🔗 Externe Link</button>
                        </div>
                    </div>
                    <div id="uploadFieldContainer">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Upload Audio/ZIP</label>
                        <input type="file" id="stemFile" accept=".mp3,.wav,.zip,.rar" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:bg-cyan-950 file:text-cyan-400 cursor-pointer">
                    </div>
                    <div id="linkFieldContainer" class="hidden">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Link naar je stems</label>
                        <input type="url" id="externalUrl" placeholder="https://wetransfer.com/..." class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">I am looking for a...</label>
                        <input type="text" id="lookingFor" placeholder="e.g., Remix" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg cursor-pointer">Drop on the Marketplace</button>
                </form>
            </div>

            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-white flex items-center gap-2"><span>🎧</span> Available Stems</h2>
                    <button onclick="loadStems()" class="text-xs bg-gray-800 border border-gray-700 text-gray-300 px-3 py-1.5 rounded-lg cursor-pointer">🔄 Refresh</button>
                </div>
                <div id="loading" class="text-center py-12 text-gray-500">Loading stems from the database...</div>
                <div id="marketplaceList" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
            </div>
        </div>
    </div>

    <script>
        // PLAK HIERONDER JOUW EXACTE GOOGLE WEB APP LINK VANAF DE NIEUWE VERSIE:
        const API_URL = "https://script.google.com/macros/s/AKfycbyXbBcipH3z0nnfgL8KaxUacZL0uxuQbjtEG06SUbLZXhq6InSk09NsU4mwALFxmjdh/exec";
        
        let shareMethod = "upload";
        const btnUpload = document.getElementById('btnMethodUpload');
        const btnLink = document.getElementById('btnMethodLink');
        const uploadContainer = document.getElementById('uploadFieldContainer');
        const linkContainer = document.getElementById('linkFieldContainer');
        const fileInput = document.getElementById('stemFile');
        const linkInput = document.getElementById('externalUrl');

        btnUpload.addEventListener('click', () => {
            shareMethod = "upload";
            btnUpload.className = "bg-cyan-600 text-white text-xs font-bold py-2 px-2 rounded-lg border border-cyan-400 cursor-pointer";
            btnLink.className = "bg-gray-800 text-gray-400 text-xs font-bold py-2 px-2 rounded-lg border border-gray-700 cursor-pointer";
            uploadContainer.classList.remove('hidden');
            linkContainer.classList.add('hidden');
            fileInput.required = true;
            linkInput.required = false;
        });

        btnLink.addEventListener('click', () => {
            shareMethod = "link";
            btnLink.className = "bg-cyan-600 text-white text-xs font-bold py-2 px-2 rounded-lg border border-cyan-400 cursor-pointer";
            btnUpload.className = "bg-gray-800 text-gray-400 text-xs font-bold py-2 px-2 rounded-lg border border-gray-700 cursor-pointer";
            linkContainer.classList.remove('hidden');
            uploadContainer.classList.add('hidden');
            fileInput.required = false;
            linkInput.required = true;
        });

        fileInput.required = true;

        async function loadStems() {
            const loadingDiv = document.getElementById('loading');
            const listDiv = document.getElementById('marketplaceList');
            loadingDiv.classList.remove('hidden');
            listDiv.classList.add('hidden');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                listDiv.innerHTML = '';
                
                if (!data || data.length === 0) {
                    listDiv.innerHTML = '<p class="text-gray-500 col-span-2 text-center py-8">No stems dropped yet. Be the first!</p>';
                } else {
                    data.reverse().forEach(item => {
                        const card = document.createElement('div');
                        card.className = "bg-gray-950/80 border border-gray-800 p-5 rounded-xl flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-purple-950 text-purple-300 border border-purple-800">${item.stemType || 'Unknown'}</span>
                                    <span class="text-xs text-gray-500">${item.bpmKey || ''}</span>
                                </div>
                                <h3 class="text-lg font-bold text-white mb-0.5">${item.trackTitle || 'Untitled'}</h3>
                                <p class="text-sm text-cyan-400 mb-4">By ${item.artistName || 'Anonymous'}</p>
                                <div class="bg-gray-900 border border-gray-800/60 p-2.5 rounded-lg text-xs mb-4">
                                    <strong class="text-gray-400 block mb-0.5">Looking for:</strong>
                                    <span class="text-gray-200">${item.lookingFor || 'Collaboration'}</span>
                                </div>
                            </div>
                            <a href="${item.downloadUrl}" target="_blank" class="w-full text-center bg-gray-800 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg text-sm border border-gray-700 block">📥 Download Stems</a>
                        `;
                        listDiv.appendChild(card);
                    });
                }
            } catch (error) {
                console.error(error);
                listDiv.innerHTML = '<p class="text-red-400 col-span-2 text-center py-8">Could not load stems. Please try again later.</p>';
            } finally {
                loadingDiv.classList.add('hidden');
                listDiv.classList.remove('hidden');
            }
        }

        document.getElementById('stemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            
            let payload = {
                artistName: document.getElementById('artistName').value,
                trackTitle: document.getElementById('trackTitle').value,
                bpmKey: document.getElementById('bpmKey').value,
                stemType: document.getElementById('stemType').value,
                lookingFor: document.getElementById('lookingFor').value
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            try {
                if (shareMethod === "upload") {
                    const file = fileInput.files[0];
                    if (file.size > 35 * 1024 * 1024) {
                        alert("File too large (Max 35MB). Gebruik 'Externe Link'!");
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Drop on the Marketplace";
                        return;
                    }
                    
                    const toBase64 = file => new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = error => reject(error);
                    });
                    payload.fileData = await toBase64(file);
                    payload.fileName = file.name;
                } else {
                    payload.externalUrl = linkInput.value;
                }

                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('stemForm').reset();
                btnUpload.click();
                alert("Boom! Track toegevoegd!");
                setTimeout(loadStems, 1500);
            } catch (error) {
                console.error(error);
                alert("Fout bij uploaden.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Drop on the Marketplace";
            }
        });

        window.onload = loadStems;
    </script>
</body>
</html>
